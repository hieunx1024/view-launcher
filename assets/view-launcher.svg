<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="8"/>

  <!-- Subtle Inner Border -->
  <rect x="40" y="40" width="432" height="432" rx="100" fill="none" stroke="#475569" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Search Glass Ring (Glow) -->
  <circle cx="230" cy="220" r="100" fill="none" stroke="url(#cyanGrad)" stroke-width="28" stroke-linecap="round" filter="url(#glow)" opacity="0.3"/>
  <circle cx="230" cy="220" r="100" fill="none" stroke="url(#cyanGrad)" stroke-width="24" stroke-linecap="round"/>

  <!-- Search Glass Handle -->
  <path d="M305 295 L390 380" stroke="url(#cyanGrad)" stroke-width="28" stroke-linecap="round"/>
  <path d="M305 295 L390 380" stroke="#bae6fd" stroke-width="12" stroke-linecap="round"/>

  <!-- Terminal Prompt Chevron inside Glass `❯` -->
  <path d="M195 175 L245 220 L195 265" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Blinking Cursor Bar `_` -->
  <rect x="255" y="252" width="30" height="12" rx="4" fill="#38bdf8"/>
</svg>
