[package]
name = "view-launcher"
version = "0.3.2"
edition = "2024"
authors = ["Hieu Nguyen <hieunx@outlook.com>"]
description = "A minimalist, high-performance desktop app & file launcher in Rust (<5ms)"
license = "MIT"
repository = "https://github.com/hieunx1024/view-launcher"
readme = "README.md"
keywords = ["launcher", "slint", "gui", "wayland", "fuzzy-search"]
categories = ["command-line-utilities", "gui"]

[lib]
name = "view_launcher"
path = "src/lib.rs"

[[bin]]
name = "view-launcher"
path = "src/main.rs"

[dependencies]
slint = { version = "=1.9.2", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2"] }
i-slint-backend-winit = "=1.9.2"
fuzzy-matcher = "0.3.7"
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "bmp"] }
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"
rayon = "1.10"
arboard = "3.4"
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
] }

[build-dependencies]
slint-build = "=1.9.2"

[package.metadata.deb]
name = "view-launcher"
maintainer = "Hieu Nguyen <hieunx@outlook.com>"
copyright = "2026, Hieu Nguyen <hieunx@outlook.com>"
license-file = ["README.md", "4"]
extended-description = """\
A minimalist, high-performance desktop GUI app & file launcher in Rust (<5ms). \
Supports Wayland, X11, and Windows with native system icons, smart fuzzy search, \
Vietnamese accent normalization, inline calculator, and configurable paths."""
section = "utils"
priority = "optional"
assets = [
    ["target/release/view-launcher", "usr/bin/view-launcher", "755"],
    ["assets/view-launcher.desktop", "usr/share/applications/view-launcher.desktop", "644"],
    ["assets/view-launcher.svg", "usr/share/icons/hicolor/scalable/apps/view-launcher.svg", "644"],
    ["assets/view-launcher.png", "usr/share/pixmaps/view-launcher.png", "644"],
    ["README.md", "usr/share/doc/view-launcher/README.md", "644"],
]
