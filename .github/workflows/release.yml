name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev libx11-dev libx11-xcb-dev xvfb

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit tests
        run: xvfb-run cargo test --verbose

      - name: Build release binary
        run: cargo build --release

      - name: Create tarball
        run: |
          tar -czvf view-launcher-linux-x86_64.tar.gz -C target/release view-launcher

      - name: Build Debian package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p target/deb-pkg/usr/bin target/deb-pkg/usr/share/applications target/deb-pkg/usr/share/pixmaps target/deb-pkg/usr/share/icons/hicolor/scalable/apps target/deb-pkg/DEBIAN
          cp target/release/view-launcher target/deb-pkg/usr/bin/
          chmod 755 target/deb-pkg/usr/bin/view-launcher
          cp assets/view-launcher.desktop target/deb-pkg/usr/share/applications/
          cp assets/view-launcher.png target/deb-pkg/usr/share/pixmaps/
          cp assets/view-launcher.svg target/deb-pkg/usr/share/pixmaps/
          cp assets/view-launcher.svg target/deb-pkg/usr/share/icons/hicolor/scalable/apps/
          cat << EOF > target/deb-pkg/DEBIAN/control
          Package: view-launcher
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Hieu Nguyen <hieunx@outlook.com>
          Description: High-performance minimalist GUI desktop app & file launcher in Rust (<5ms)
          EOF
          cat << 'EOF' > target/deb-pkg/DEBIAN/postinst
          #!/bin/sh
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then
              update-desktop-database -q /usr/share/applications || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
              gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor 2>/dev/null || true
          fi
          exit 0
          EOF
          chmod 755 target/deb-pkg/DEBIAN/postinst
          dpkg-deb --build target/deb-pkg "view-launcher_${VERSION}_amd64.deb"

      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: |
            view-launcher-linux-x86_64.tar.gz
            view-launcher_*_amd64.deb

  build-windows:
    name: Build Windows Packages
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run unit tests
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release

      - name: Create portable zip
        run: |
          Compress-Archive -Path target/release/view-launcher.exe, assets/view-launcher.ico, README.md -DestinationPath view-launcher-windows-x86_64.zip

      - name: Compile Inno Setup Installer
        run: |
          iscc installer\windows\setup.iss

      - name: Copy installer
        run: |
          Copy-Item -Path "installer\windows\Output\view-launcher-setup.exe" -Destination "view-launcher-setup.exe"

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            view-launcher-setup.exe
            view-launcher-windows-x86_64.zip

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release-assets
          path: release-assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
